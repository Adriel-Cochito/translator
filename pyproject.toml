[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "translator-live"
version = "1.0.0"
description = "Tradução e legendas ao vivo no desktop"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Translator Live" }]

[project.scripts]
translator-live = "translator.main:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
